services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: libros_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true
    networks:
      - libros_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: libros_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://libros_user:libros_pass@postgres:5432/libros_db
      - SECRET_KEY=cambia_esto_por_una_clave_secreta_segura
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - libros_network

  postgres:
    image: postgres:16-alpine
    container_name: libros_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=libros_user
      - POSTGRES_PASSWORD=libros_pass
      - POSTGRES_DB=libros_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libros_user -d libros_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - libros_network

volumes:
  postgres_data:

networks:
  libros_network:
    driver: bridge
